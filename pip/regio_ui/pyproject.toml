[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regio-ui"
version = "0.2.0"
authors = [
  { name="Pev Hall", email="pev.hall@gmail.com" },
]
description = "regio TCP proxy TUI (textual) — logs all regio operations between a regio TCP server and its clients, and can send new operations"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
dependencies = [
  "textual>=8.0",
  "regio",
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[project.scripts]
regio-ui = "regio_ui:main"

[project.urls]
Homepage = "https://github.com/pevhall/hdlskel"

[tool.hatch.build.targets.wheel]
packages = ["src/regio_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
